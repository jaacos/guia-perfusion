    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Gris oscuro para el fondo */
            color: #f3f4f6; /* Texto claro */
        }
        .card {
            background-color: #1f2937; /* Gris un poco más claro para las tarjetas */
            border: 1px solid #374151;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            border-bottom: 1px solid #374151;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }
        .card-subtitle {
            font-size: 0.875rem;
            color: #9ca3af;
            text-transform: uppercase;
        }
        .card-content {
            flex-grow: 1;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #374151;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: #d1d5db;
            flex-shrink: 0;
            margin-right: 1rem;
        }
        .info-value {
            text-align: right;
            color: #f9fafb;
        }
        #searchInput {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #f3f4f6;
        }
        #searchInput::placeholder {
            color: #9ca3af;
        }
        .highlight {
            background-color: #facc15; /* Amarillo para resaltar */
            color: #1f2937;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>

        <div id="noResults" class="text-center py-16 hidden">
            <p class="text-xl text-gray-400">No se encontraron fármacos que coincidan con la búsqueda.</p>
        </div>

        // --- LÓGICA DE LA APLICACIÓN ---
        const container = document.getElementById('farmacosContainer');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');

        const renderFarmacos = (farmacosAMostrar, searchTerm = '') => {
            container.innerHTML = ''; 
            
            if (farmacosAMostrar.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }

            const highlight = (text) => {
                if (!searchTerm || !text) return text;
                const regex = new RegExp(`(${searchTerm.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
                return text.replace(regex, '<span class="highlight">$1</span>');
            };

            farmacosAMostrar.forEach(farmaco => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <h2 class="card-title">${highlight(farmaco.nombreComercial)}</h2>
                        <h3 class="card-subtitle">${highlight(farmaco.principioActivo)}</h3>
                    </div>
                    <div class="card-content">
                        ${farmaco.presentacion ? `<div class="info-item"><span class="info-label">Presentación</span><span class="info-value">${farmaco.presentacion}</span></div>` : ''}
                        ${farmaco.bolo ? `<div class="info-item"><span class="info-label">Bolo</span><span class="info-value">${farmaco.bolo}</span></div>` : ''}
                        ${farmaco.perfusion ? `<div class="info-item"><span class="info-label">Perfusión</span><span class="info-value">${farmaco.perfusion}</span></div>` : ''}
                        ${farmaco.dilucion ? `<div class="info-item"><span class="info-label">Dilución (50cc)</span><span class="info-value">${farmaco.dilucion}</span></div>` : ''}
                        ${farmaco.concentracion ? `<div class="info-item"><span class="info-label">Concentración</span><span class="info-value">${farmaco.concentracion}</span></div>` : ''}
                        ${farmaco.ritmoDosis ? `<div class="info-item"><span class="info-label">Ritmo/Dosis</span><span class="info-value">${farmaco.ritmoDosis}</span></div>` : ''}
                        ${farmaco.observaciones ? `<div class="info-item"><span class="info-label">Observaciones</span><span class="info-value">${farmaco.observaciones}</span></div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        };

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const farmacosFiltrados = farmacos.filter(farmaco => 
                farmaco.nombreComercial.toLowerCase().includes(searchTerm) ||
                farmaco.principioActivo.toLowerCase().includes(searchTerm)
            );
            renderFarmacos(farmacosFiltrados, searchTerm);
        });

        window.onload = () => {
            farmacos.sort((a, b) => a.nombreComercial.localeCompare(b.nombreComercial));
            renderFarmacos(farmacos);
        };

        // --- REGISTRO DEL SERVICE WORKER PARA PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').then(registration => {
                    console.log('ServiceWorker registrado con éxito: ', registration.scope);
                }, err => {
                    console.log('Fallo en el registro del ServiceWorker: ', err);
                });
            });
        }

    </script>
</body>
</html>
