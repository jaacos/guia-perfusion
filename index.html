<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Rápida de Perfusión</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Perfusión SUC">
    <link rel="apple-touch-icon" href="icons/maskable_icon_x192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/maskable_icon_x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/maskable_icon_x512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg0:#0a0d12;--bg1:#111620;--bg2:#182030;--bg3:#1e2a3d;
            --border:rgba(100,140,200,0.13);--border-hover:rgba(100,160,255,0.28);
            --text-primary:#e8edf5;--text-secondary:#9db3cc;--text-muted:#6a84a0;
            --accent:#3b82f6;--accent-soft:rgba(59,130,246,0.12);--accent-glow:rgba(59,130,246,0.25);
            --amber:#f59e0b;--amber-soft:rgba(245,158,11,0.12);
            --red:#ef4444;--red-soft:rgba(239,68,68,0.10);
            --green:#22c55e;--green-soft:rgba(34,197,94,0.10);
            --teal:#14b8a6;--purple:#a78bfa;--purple-soft:rgba(167,139,250,0.10);
            --orange:#f97316;--orange-soft:rgba(249,115,22,0.10);
            --radius:10px;--radius-lg:14px;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Syne',sans-serif;background:var(--bg0);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}
        header{position:sticky;top:0;z-index:100;background:rgba(10,13,18,0.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0.9rem 1rem;}
        .header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
        .header-title{font-size:1.1rem;font-weight:700;color:var(--text-primary);letter-spacing:-0.01em;white-space:nowrap;}
        .header-title span{color:#e53935;}
        .header-sub{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--text-muted);margin-top:1px;}
        .search-wrap{flex:1;min-width:200px;position:relative;}
        .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;}
        #searchInput{width:100%;padding:0.6rem 1rem 0.6rem 2.4rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-family:'Syne',sans-serif;font-size:0.9rem;transition:border-color 0.2s,box-shadow 0.2s;outline:none;}
        #searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
        #searchInput::placeholder{color:var(--text-muted);}
        .filters-wrap{max-width:1400px;margin:0 auto;padding:0.75rem 1rem;display:flex;gap:0.4rem;flex-wrap:wrap;}
        .filter-btn{white-space:nowrap;padding:0.35rem 0.85rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;font-size:0.72rem;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:5px;}
        .filter-btn:hover{border-color:var(--border-hover);color:var(--text-primary);background:var(--bg2);}
        .filter-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
        .filter-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
        .result-bar{max-width:1400px;margin:0 auto;padding:0.3rem 1rem 0.6rem;display:flex;align-items:center;}
        .result-count{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--text-muted);}
        .result-count span{color:var(--accent);}
        .grid{max-width:1400px;margin:0 auto;padding:0 1rem 2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;}
        .card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;transition:border-color 0.18s,transform 0.18s,box-shadow 0.18s;display:flex;flex-direction:column;overflow:hidden;animation:fadeIn 0.25s ease both;}
        .card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.35);}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
        .card-top{padding:1rem 1rem 0.75rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:0.5rem;}
        .card-name{font-size:1rem;font-weight:700;color:var(--text-primary);line-height:1.2;}
        .card-pa{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--text-muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em;}
        .cat-badge{flex-shrink:0;padding:3px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.03em;}
        .card-body{padding:0.75rem 1rem;flex:1;display:flex;flex-direction:column;gap:0.3rem;}
        .card-row{display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem;padding:3px 0;border-bottom:1px solid rgba(100,140,200,0.06);}
        .card-row:last-child{border-bottom:none;}
        .card-label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0;}
        .card-val{font-size:0.8rem;color:var(--text-secondary);text-align:right;line-height:1.3;}
        .card-val.key{color:var(--text-primary);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:0.75rem;}
        .card-footer{padding:0.6rem 1rem;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:0.4rem;}
        .warn-tag{display:flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:600;}
        .warn-vc{background:var(--red-soft);color:var(--red);}
        .warn-luz{background:var(--amber-soft);color:var(--amber);}
        .warn-vel{background:var(--orange-soft);color:var(--orange);}
        .warn-bomb{background:var(--purple-soft);color:var(--purple);}
        .hl{background:rgba(245,158,11,0.25);color:#fcd34d;border-radius:3px;padding:0 2px;}
        #noResults{display:none;max-width:1400px;margin:4rem auto;text-align:center;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.85rem;}
        /* MODAL */
        #modalBackdrop{display:none;position:fixed;inset:0;background:rgba(5,8,15,0.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;align-items:flex-end;justify-content:center;padding:0;}
        @media(max-width:639px){#modalBackdrop{padding:0;}#modal{width:100vw;border-radius:var(--radius-lg) var(--radius-lg) 0 0;}}
        #modalBackdrop.open{display:flex;}
        #modal{background:var(--bg1);border:1px solid var(--border-hover);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;overflow-x:hidden;padding:1.5rem 1.25rem 2rem;position:relative;animation:slideUp 0.25s cubic-bezier(0.22,1,0.36,1);word-break:break-word;}
        @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @media(min-width:640px){#modalBackdrop{align-items:center;padding:1rem;}#modal{border-radius:var(--radius-lg);max-height:88vh;}}
        #modalClose{position:absolute;top:1rem;right:1rem;background:var(--bg3);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:1.1rem;transition:background 0.15s;}
        #modalClose:hover{background:var(--bg2);color:var(--text-primary);}
        .modal-name{font-size:1.5rem;font-weight:700;color:var(--text-primary);padding-right:2.5rem;}
        .modal-pa{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;margin-bottom:1rem;}
        .modal-alerts{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.1rem;}
        .alert-pill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:600;}
        .alert-vc{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,68,68,0.25);}
        .alert-luz{background:var(--amber-soft);color:var(--amber);border:1px solid rgba(245,158,11,0.25);}
        .alert-vel{background:var(--orange-soft);color:var(--orange);border:1px solid rgba(249,115,22,0.25);}
        .alert-bomb{background:var(--purple-soft);color:var(--purple);border:1px solid rgba(167,139,250,0.25);}
        .alert-ci{background:var(--red-soft);color:var(--red);border:1px solid rgba(239,68,68,0.25);}
        .alert-inc{background:rgba(251,113,133,0.1);color:#fb7185;border:1px solid rgba(251,113,133,0.25);}
        .modal-section-title{font-family:'JetBrains Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin:1.2rem 0 0.5rem;padding-bottom:0.3rem;border-bottom:1px solid var(--border);}
        .modal-table{width:100%;border-collapse:collapse;table-layout:fixed;}
        .modal-table tr td{padding:6px 2px;border-bottom:1px solid rgba(100,140,200,0.06);font-size:0.82rem;vertical-align:top;overflow-wrap:break-word;word-break:break-word;}
        .modal-table tr:last-child td{border-bottom:none;}
        .modal-table td:first-child{font-family:'JetBrains Mono',monospace;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);width:38%;padding-right:8px;}
        .modal-table td:last-child{color:var(--text-secondary);}
        .modal-table .val-key{color:var(--text-primary);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:0.78rem;}
        /* CALCULADORA */
        .calc-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.2rem;}
        .calc-title{font-family:'JetBrains Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);margin-bottom:0.75rem;}
        .calc-input-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;}
        .calc-input-row label{font-size:0.82rem;color:var(--text-secondary);white-space:nowrap;}
        .kg-input{width:90px;padding:0.45rem 0.75rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-family:'JetBrains Mono',monospace;font-size:0.9rem;font-weight:600;text-align:center;outline:none;transition:border-color 0.15s;}
        .kg-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
        .kg-presets{display:flex;gap:0.4rem;flex-wrap:wrap;}
        .kg-preset{padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.7rem;cursor:pointer;transition:all 0.15s;}
        .kg-preset:hover,.kg-preset.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
        .calc-result{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.75rem 1rem;margin-top:0.75rem;}
        .calc-result-label{font-family:'JetBrains Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:0.25rem;}
        .calc-result-value{font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:600;color:var(--green);}
        .calc-result-detail{font-size:0.72rem;color:var(--text-muted);margin-top:2px;}
        /* ── CHAT ── */
        #chatBtn{position:fixed;bottom:1.5rem;right:1.5rem;z-index:300;width:52px;height:52px;border-radius:50%;background:#e53935;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(229,57,53,0.4);transition:transform 0.18s,box-shadow 0.18s;}
        #chatBtn:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(229,57,53,0.55);}
        #chatBtn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
        #chatPanel{position:fixed;bottom:0;right:0;z-index:299;width:100%;max-width:420px;height:88vh;background:var(--bg1);border-left:1px solid var(--border-hover);border-top:1px solid var(--border-hover);border-radius:14px 0 0 0;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.22,1,0.36,1);box-shadow:-8px 0 40px rgba(0,0,0,0.4);}
        #chatPanel.open{transform:translateX(0);}
        @media(min-width:640px){#chatPanel{border-radius:14px 14px 0 0;bottom:0;right:1.5rem;width:400px;height:82vh;}}
        .chat-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
        .chat-header-title{font-size:0.95rem;font-weight:700;color:var(--text-primary);}
        .chat-header-title span{color:#e53935;}
        .chat-header-sub{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:var(--text-muted);margin-top:1px;}
        #chatClose{background:var(--bg3);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);font-size:1rem;transition:background 0.15s;flex-shrink:0;}
        #chatClose:hover{background:var(--bg2);color:var(--text-primary);}
        #chatMessages{flex:1;overflow-y:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:0.75rem;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent;}
        .chat-msg{max-width:88%;line-height:1.5;font-size:0.82rem;padding:0.6rem 0.9rem;border-radius:12px;word-break:break-word;}
        .chat-msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(59,130,246,0.25);color:var(--text-primary);border-radius:12px 12px 3px 12px;}
        .chat-msg.assistant{align-self:flex-start;background:var(--bg2);border:1px solid var(--border);color:var(--text-secondary);border-radius:12px 12px 12px 3px;}
        .chat-msg.assistant strong{color:var(--text-primary);}
        .chat-msg.typing{color:var(--text-muted);font-style:italic;}
        .chat-empty{text-align:center;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.7rem;margin:auto;padding:2rem 1rem;line-height:1.8;}
        .chat-empty span{display:block;font-size:1.5rem;margin-bottom:0.75rem;}
        .chat-suggestions{display:flex;flex-direction:column;gap:0.4rem;margin-top:1rem;}
        .chat-suggestion{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:0.45rem 0.75rem;font-size:0.72rem;color:var(--text-secondary);cursor:pointer;text-align:left;transition:border-color 0.15s,color 0.15s;}
        .chat-suggestion:hover{border-color:var(--border-hover);color:var(--text-primary);}
        .chat-input-wrap{padding:0.85rem 1.25rem;border-top:1px solid var(--border);display:flex;gap:0.6rem;align-items:flex-end;flex-shrink:0;}
        #chatInput{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:0.6rem 0.85rem;color:var(--text-primary);font-family:'Syne',sans-serif;font-size:0.85rem;resize:none;outline:none;max-height:120px;line-height:1.4;transition:border-color 0.2s;}
        #chatInput:focus{border-color:var(--accent);}
        #chatInput::placeholder{color:var(--text-muted);}
        #chatSend{width:38px;height:38px;border-radius:9px;background:#e53935;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s,transform 0.15s;}
        #chatSend:hover{background:#c62828;transform:scale(1.05);}
        #chatSend:disabled{background:var(--bg3);cursor:not-allowed;transform:none;}
        #chatSend svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
        /* SELECTOR MODO CALC DUAL */
        .calc-mode-wrap{display:flex;gap:0.4rem;margin-bottom:0.85rem;}
        .calc-mode-btn{flex:1;padding:0.4rem 0;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:0.68rem;cursor:pointer;transition:all 0.15s;text-align:center;}
        .calc-mode-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
        /* CALCULADORA BOLO */
        .calc-bolo-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-top:1.2rem;}
        .calc-bolo-title{font-family:'JetBrains Mono',monospace;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;color:#fb923c;margin-bottom:0.75rem;}
        .bolo-result-row{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:0.65rem 1rem;margin-top:0.5rem;}
        .bolo-result-label{font-family:'JetBrains Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px;}
        .bolo-result-value{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:600;color:#fb923c;}
        .bolo-result-vol{font-size:0.72rem;color:var(--text-muted);margin-top:2px;}
        /* CATEGORÍAS */
        .cat-vasoactivo{background:rgba(239,68,68,0.12);color:#f87171;}
        .cat-sedacion{background:rgba(167,139,250,0.12);color:#a78bfa;}
        .cat-analgesico{background:rgba(249,115,22,0.12);color:#fb923c;}
        .cat-relajante{background:rgba(20,184,166,0.12);color:#14b8a6;}
        .cat-antiarritmico{background:rgba(59,130,246,0.12);color:#60a5fa;}
        .cat-antihipertensivo{background:rgba(34,197,94,0.12);color:#4ade80;}
        .cat-anticoagulante{background:rgba(245,158,11,0.12);color:#fbbf24;}
        .cat-antiepilepsico{background:rgba(251,113,133,0.12);color:#fb7185;}
        .cat-metabolico{background:rgba(100,140,200,0.12);color:#93c5fd;}
        .cat-revertidor{background:rgba(167,139,250,0.12);color:#c4b5fd;}
        .cat-otro{background:rgba(100,120,150,0.12);color:#94a3b8;}
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div>
            <div class="header-title">Guía <span>Perfusión</span> SUC</div>
            <div class="header-sub">Diluciones · 50 cc estándar</div>
        </div>
        <div class="search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="searchInput" placeholder="Buscar fármaco..." autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
    </div>
</header>
<div class="filters-wrap" id="filtersWrap"></div>
<div class="result-bar"><div class="result-count" id="resultCount"></div></div>
<div class="grid" id="farmacosContainer"></div>
<div id="noResults">No se encontraron fármacos que coincidan.</div>

<div id="modalBackdrop" role="dialog" aria-modal="true">
    <div id="modal">
        <button id="modalClose" aria-label="Cerrar">✕</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>
const CATS = {
    vasoactivo:       {label:'Vasoactivo',        color:'cat-vasoactivo',       dot:'#f87171'},
    sedacion:         {label:'Sedación',           color:'cat-sedacion',         dot:'#a78bfa'},
    analgesico:       {label:'Analgésico',         color:'cat-analgesico',       dot:'#fb923c'},
    relajante:        {label:'Relajante muscular', color:'cat-relajante',        dot:'#14b8a6'},
    antiarritmico:    {label:'Antiarrítmico',      color:'cat-antiarritmico',    dot:'#60a5fa'},
    antihipertensivo: {label:'Antihipertensivo',   color:'cat-antihipertensivo', dot:'#4ade80'},
    anticoagulante:   {label:'Anticoagulante',     color:'cat-anticoagulante',   dot:'#fbbf24'},
    antiepilepsico:   {label:'Antiepiléptico',     color:'cat-antiepilepsico',   dot:'#fb7185'},
    metabolico:       {label:'Metabólico',         color:'cat-metabolico',       dot:'#93c5fd'},
    revertidor:       {label:'Revertidor',         color:'cat-revertidor',       dot:'#c4b5fd'},
    otro:             {label:'Otro',               color:'cat-otro',             dot:'#94a3b8'},
};

// ─── BASE DE DATOS ────────────────────────────────────────────────────────────
// calcPerfusion(kg) → { label, minMLh, maxMLh, nota }
// null = sin calculadora (dosis fija no peso-dependiente o solo bolo)
const farmacos = [
    // ── SEDACIÓN ──────────────────────────────────────────────
    {
        id:'propofol1', nombreComercial:'DIPRIVAN 1%', principioActivo:'Propofol',
        categoria:'sedacion',

// ── UTILS ─────────────────────────────────────────────────────────────────────
const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function hl(text, term) {
    if (!term || !text) return text || '';
    const t = String(text), nt = normalize(t), nn = normalize(term);
    if (!nn) return t;
    let r = '', i = 0;
    while (i < t.length) {
        if (nt.slice(i).startsWith(nn)) {
            r += `<span class="hl">${t.slice(i, i+term.length)}</span>`;
            i += term.length;
        } else { r += t[i]; i++; }
    }
    return r;
}

function alertTags(f) {
    const a = f.alertas||[];
    const tags = [];
    if (a.includes('viacentral')) tags.push(['warn-vc','↑ VÍA CENTRAL']);
    if (a.includes('luz'))         tags.push(['warn-luz','☀ FOTOSENSIBLE']);
    if (a.includes('velocidad'))   tags.push(['warn-vel','⚠ VEL. MÁX.']);
    if (a.includes('bombaICC'))    tags.push(['warn-bomb','⊞ BOMBA JERINGA']);
    return tags;
}

// ── ESTADO ────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let searchTerm = '';

// ── FILTROS ───────────────────────────────────────────────────────────────────
function renderFilters() {
    const wrap = document.getElementById('filtersWrap');
    wrap.innerHTML = '';
    const mkBtn = (key, label, dot) => {
        const b = document.createElement('button');
        b.className = 'filter-btn' + (activeFilter===key?' active':'');
        b.innerHTML = dot ? `<span class="filter-dot" style="background:${dot}"></span>${label}` : label;
        b.onclick = () => { activeFilter=key; renderAll(); };
        wrap.appendChild(b);
    };
    mkBtn('all','Todos');
    [...new Set(farmacos.map(f=>f.categoria))].sort().forEach(cat=>{
        const c=CATS[cat]; if(c) mkBtn(cat,c.label,c.dot);
    });
}

// ── CARDS ─────────────────────────────────────────────────────────────────────
function renderAll() {
    renderFilters();
    const container = document.getElementById('farmacosContainer');
    const noRes = document.getElementById('noResults');
    const countEl = document.getElementById('resultCount');
    container.innerHTML = '';

    let filtered = farmacos.filter(f=>{
        const ms = !searchTerm ||
            normalize(f.nombreComercial).includes(normalize(searchTerm)) ||
            normalize(f.principioActivo).includes(normalize(searchTerm));
        const mf = activeFilter==='all' || f.categoria===activeFilter;
        return ms && mf;
    }).sort((a,b)=>a.nombreComercial.localeCompare(b.nombreComercial,'es'));

    countEl.innerHTML = `<span>${filtered.length}</span> fármaco${filtered.length!==1?'s':''}`;
    noRes.style.display = filtered.length===0 ? 'block' : 'none';

    filtered.forEach((f,i)=>{
        const c = CATS[f.categoria]||CATS.otro;
        const tags = alertTags(f);
        const card = document.createElement('div');
        card.className='card';
        card.style.animationDelay=(i*20)+'ms';
        card.onclick=()=>openModal(f);
        card.innerHTML=`
            <div class="card-top">
                <div>
                    <div class="card-name">${hl(f.nombreComercial,searchTerm)}</div>
                    <div class="card-pa">${hl(f.principioActivo,searchTerm)}</div>
                </div>
                <span class="cat-badge ${c.color}">${c.label}</span>
            </div>
            <div class="card-body">
                <div class="card-row"><span class="card-label">Presentación</span><span class="card-val">${f.presentacion}</span></div>
                <div class="card-row"><span class="card-label">Dilución 50 cc</span><span class="card-val key">${f.dilucion}</span></div>
                <div class="card-row"><span class="card-label">Concentración</span><span class="card-val key">${f.concentracion}</span></div>
                <div class="card-row"><span class="card-label">Ritmo (~70 kg)</span><span class="card-val">${f.ritmo70}</span></div>
            </div>
            ${tags.length>0?`<div class="card-footer">${tags.map(([cls,lbl])=>`<span class="warn-tag ${cls}">${lbl}</span>`).join('')}</div>`:''}
        `;
        container.appendChild(card);
    });
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
let currentFarmaco = null;

function openModal(f) {
    currentFarmaco = f;
    const c = CATS[f.categoria]||CATS.otro;
    const a = f.alertas||[];
    const pills = [];
    if (a.includes('viacentral'))  pills.push(`<span class="alert-pill alert-vc">↑ VÍA CENTRAL OBLIGATORIA</span>`);
    if (a.includes('luz'))          pills.push(`<span class="alert-pill alert-luz">☀ FOTOSENSIBLE — CUBRIR LÍNEA</span>`);
    if (a.includes('velocidad'))    pills.push(`<span class="alert-pill alert-vel">⚠ VELOCIDAD MÁXIMA RESTRINGIDA</span>`);
    if (a.includes('bombaICC'))     pills.push(`<span class="alert-pill alert-bomb">⊞ SIEMPRE EN BOMBA DE JERINGA</span>`);
    if (f.contraindicaciones)       pills.push(`<span class="alert-pill alert-ci">✕ CI: ${f.contraindicaciones}</span>`);
    if (f.incompatibilidades)       pills.push(`<span class="alert-pill alert-inc">≠ INC: ${f.incompatibilidades}</span>`);

    const hasCalc = typeof f.calcPerfusion==='function';
    const hasCalcBolo = typeof f.calcBolo==='function';
    const isDual = hasCalc && f.calcPerfusion(70)?._dual === true;

    document.getElementById('modalContent').innerHTML=`
        <div class="modal-name">${f.nombreComercial}</div>
        <div class="modal-pa">${f.principioActivo} · <span class="${c.color}" style="padding:2px 8px;border-radius:5px;font-size:0.65rem;">${c.label}</span></div>
        ${pills.length>0?`<div class="modal-alerts">${pills.join('')}</div>`:''}
        <div class="modal-section-title">Preparación</div>
        <table class="modal-table">
            <tr><td>Presentación</td><td>${f.presentacion}</td></tr>
            <tr><td>Dilución (50 cc)</td><td class="val-key">${f.dilucion}</td></tr>
            <tr><td>Concentración</td><td class="val-key">${f.concentracion}</td></tr>
        </table>
        <div class="modal-section-title">Dosificación</div>
        <table class="modal-table">
            ${f.bolo?`<tr><td>Bolo</td><td>${f.bolo}</td></tr>`:''}
            ${f.perfusion?`<tr><td>Perfusión</td><td>${f.perfusion}</td></tr>`:''}
            <tr><td>Ritmo ref. (70 kg)</td><td class="val-key">${f.ritmo70}</td></tr>
            ${f.observaciones?`<tr><td>Observaciones</td><td>${f.observaciones}</td></tr>`:''}
        </table>
        ${hasCalcBolo?`
        <div class="calc-bolo-box">
            <div class="calc-bolo-title">⊕ Calculadora de dosis en bolo</div>
            <div class="calc-input-row">
                <label>Peso (kg)</label>
                <input type="number" class="kg-input" id="kgBoloInput" value="70" min="10" max="200" step="1">
            </div>
            <div class="kg-presets" id="boloPresets">
                ${[40,50,60,70,80,90,100,110,120].map(k=>`<button class="kg-preset${k===70?' active':''}" data-kg="${k}">${k}</button>`).join('')}
            </div>
            <div id="boloResults"></div>
        </div>`:''}
        ${hasCalc?`
        <div class="calc-box">
            <div class="calc-title">⊕ Calculadora de perfusión</div>
            ${isDual?`
            <div class="calc-mode-wrap">
                <button class="calc-mode-btn active" id="modeFixed">µg/min (fija)</button>
                <button class="calc-mode-btn" id="modeWeight">µg/kg/min (por peso)</button>
            </div>`:''}
            <div class="calc-input-row" id="kgRow" style="${isDual?'display:none':''}">
                <label>Peso (kg)</label>
                <input type="number" class="kg-input" id="kgInput" value="70" min="10" max="200" step="1">
            </div>
            ${isDual?'':`<div class="kg-presets">
                ${[40,50,60,70,80,90,100,110,120].map(k=>`<button class="kg-preset${k===70?' active':''}" data-kg="${k}">${k}</button>`).join('')}
            </div>`}
            <div id="kgPresetsWrap" style="display:none"><div class="kg-presets">
                ${[40,50,60,70,80,90,100,110,120].map(k=>`<button class="kg-preset${k===70?' active':''}" data-kg="${k}">${k}</button>`).join('')}
            </div></div>
            <div class="calc-result" id="calcResult"></div>
        </div>`:''}
    `;

    if (hasCalcBolo) {
        updateCalcBolo(70);
        document.getElementById('kgBoloInput').addEventListener('input', e=>{
            const v=parseInt(e.target.value);
            if(v>=10&&v<=200){updateCalcBolo(v);updateBoloActive(v);}
        });
        document.querySelectorAll('#boloPresets .kg-preset').forEach(btn=>{
            btn.addEventListener('click',()=>{
                const kg=parseInt(btn.dataset.kg);
                document.getElementById('kgBoloInput').value=kg;
                updateCalcBolo(kg); updateBoloActive(kg);
            });
        });
    }

    if (hasCalc) {
        if (isDual) {
            // modo fija por defecto
            updateCalcDual('fixed', 70);
            document.getElementById('modeFixed').addEventListener('click', ()=>{
                document.getElementById('modeFixed').classList.add('active');
                document.getElementById('modeWeight').classList.remove('active');
                document.getElementById('kgRow').style.display='none';
                document.getElementById('kgPresetsWrap').style.display='none';
                updateCalcDual('fixed', parseInt(document.getElementById('kgInput').value)||70);
            });
            document.getElementById('modeWeight').addEventListener('click', ()=>{
                document.getElementById('modeWeight').classList.add('active');
                document.getElementById('modeFixed').classList.remove('active');
                document.getElementById('kgRow').style.display='flex';
                document.getElementById('kgPresetsWrap').style.display='block';
                updateCalcDual('weight', parseInt(document.getElementById('kgInput').value)||70);
            });
            document.getElementById('kgInput').addEventListener('input', e=>{
                const v=parseInt(e.target.value);
                if(v>=10&&v<=200) updateCalcDual('weight', v);
            });
            document.querySelectorAll('#kgPresetsWrap .kg-preset').forEach(btn=>{
                btn.addEventListener('click',()=>{
                    const kg=parseInt(btn.dataset.kg);
                    document.getElementById('kgInput').value=kg;
                    updateCalcDual('weight', kg);
                    document.querySelectorAll('#kgPresetsWrap .kg-preset').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.kg)===kg));
                });
            });
        } else {
            updateCalc(70);
            document.getElementById('kgInput').addEventListener('input', e=>{
                const v=parseInt(e.target.value);
                if(v>=10&&v<=200){updateCalc(v);updateActive(v);}
            });
            document.querySelectorAll('.kg-preset').forEach(btn=>{
                btn.addEventListener('click',()=>{
                    const kg=parseInt(btn.dataset.kg);
                    document.getElementById('kgInput').value=kg;
                    updateCalc(kg); updateActive(kg);
                });
            });
        }
    }

    document.getElementById('modalBackdrop').classList.add('open');
    document.body.style.overflow='hidden';
}

function updateBoloActive(kg){
    document.querySelectorAll('#boloPresets .kg-preset').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.kg)===kg));
}

function updateCalcBolo(kg){
    if(!currentFarmaco||typeof currentFarmaco.calcBolo!=='function') return;
    const doses=currentFarmaco.calcBolo(kg);
    const el=document.getElementById('boloResults'); if(!el) return;
    el.innerHTML=doses.map(d=>{
        const mg=d.fixed?d.mg:d.mg;
        const vol=d.conc?(mg/d.conc).toFixed(2)+' mL':'—';
        const doseLabel=d.fixed?mg.toFixed(0)+' mg (fijo)':mg.toFixed(1)+' mg';
        return `<div class="bolo-result-row">
            <div class="bolo-result-label">${d.label}</div>
            <div class="bolo-result-value">${doseLabel}</div>
            <div class="bolo-result-vol">Volumen: ${vol} (conc. ${d.conc} mg/mL)</div>
        </div>`;
    }).join('');
}

function updateActive(kg){
    document.querySelectorAll('.kg-preset').forEach(b=>b.classList.toggle('active',parseInt(b.dataset.kg)===kg));
}

function updateCalcDual(mode, kg){
    const f = currentFarmaco;
    if(!f) return;
    const el = document.getElementById('calcResult'); if(!el) return;
    const c = f.calcPerfusion(kg).c; // concentración µg/mL
    if(mode==='fixed'){
        // dosis fija µg/min
        const minMcgMin=2, maxMcgMin=20;
        const minMLh=(minMcgMin*60)/c;
        const maxMLh=(maxMcgMin*60)/c;
        el.innerHTML=`
            <div class="calc-result-label">Perfusión dosis fija</div>
            <div class="calc-result-value">${minMLh.toFixed(2)} – ${maxMLh.toFixed(2)} mL/h</div>
            <div class="calc-result-detail">2–20 µg/min · concentración ${c} µg/mL</div>`;
    } else {
        // dosis por peso µg/kg/min
        const minMLh=(0.01*kg*60)/c;
        const maxMLh=(0.6*kg*60)/c;
        el.innerHTML=`
            <div class="calc-result-label">Ritmo para ${kg} kg</div>
            <div class="calc-result-value">${minMLh.toFixed(2)} – ${maxMLh.toFixed(2)} mL/h</div>
            <div class="calc-result-detail">0,01–0,6 µg/kg/min · concentración ${c} µg/mL</div>`;
    }
}

function updateCalc(kg){
    if(!currentFarmaco||typeof currentFarmaco.calcPerfusion!=='function') return;
    const res=currentFarmaco.calcPerfusion(kg);
    const el=document.getElementById('calcResult'); if(!el) return;
    const same=Math.abs(res.minMLh-res.maxMLh)<0.01;
    const val=same ? res.minMLh.toFixed(2)+' mL/h' : res.minMLh.toFixed(2)+' – '+res.maxMLh.toFixed(2)+' mL/h';
    el.innerHTML=`
        <div class="calc-result-label">${res.label}</div>
        <div class="calc-result-value">${val}</div>
        <div class="calc-result-detail">${res.nota}</div>
    `;
}

function closeModal(){
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow='';
    currentFarmaco=null;
}

document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── BÚSQUEDA ──────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input',e=>{
    searchTerm=e.target.value.trim();
    renderAll();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderAll();

if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./service-worker.js')
            .then(r=>console.log('SW:',r.scope))
            .catch(e=>console.warn('SW error:',e));
    });
}

<!-- CHAT BUTTON -->
<button id="chatBtn" aria-label="Consulta clínica">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<!-- CHAT PANEL -->
<div id="chatPanel">
    <div class="chat-header">
        <div>
            <div class="chat-header-title">Consulta <span>clínica</span></div>
            <div class="chat-header-sub">Gemini · perfil sanitario avanzado</div>
        </div>
        <button id="chatClose">✕</button>
    </div>
    <div id="chatMessages">
        <div class="chat-empty">
            <span>💊</span>
            Consulta cualquier duda clínica,<br>
            interacción, protocolo o dosis.
            <div class="chat-suggestions">
                <button class="chat-suggestion">¿Qué vasoactivo elijo en shock séptico refractario a volumen?</button>
                <button class="chat-suggestion">¿Son compatibles midazolam y fentanilo en la misma vía?</button>
                <button class="chat-suggestion">Protocolo ISR: secuencia de fármacos y dosis para 80 kg</button>
                <button class="chat-suggestion">¿Cuándo contraindico el labetalol en una crisis hipertensiva?</button>
            </div>
        </div>
    </div>
    <div class="chat-input-wrap">
        <textarea id="chatInput" placeholder="Escribe tu consulta..." rows="1" maxlength="800"></textarea>
        <button id="chatSend">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>
</div>

<script>
// ── CHAT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
const chatBtn     = document.getElementById('chatBtn');
const chatPanel   = document.getElementById('chatPanel');
const chatClose   = document.getElementById('chatClose');
const chatMessages= document.getElementById('chatMessages');
const chatInput   = document.getElementById('chatInput');
const chatSend    = document.getElementById('chatSend');

let chatHistory = [];
let chatOpen = false;
let isTyping = false;

function toggleChat() {
    chatOpen = !chatOpen;
    chatPanel.classList.toggle('open', chatOpen);
    if (chatOpen) {
        chatInput.focus();
    } else {
        // Resetear al cerrar
        chatHistory = [];
        chatMessages.innerHTML = `
            <div class="chat-empty">
                <span>💊</span>
                Consulta cualquier duda clínica,<br>
                interacción, protocolo o dosis.
                <div class="chat-suggestions">
                    <button class="chat-suggestion">¿Qué vasoactivo elijo en shock séptico refractario a volumen?</button>
                    <button class="chat-suggestion">¿Son compatibles midazolam y fentanilo en la misma vía?</button>
                    <button class="chat-suggestion">Protocolo ISR: secuencia de fármacos y dosis para 80 kg</button>
                    <button class="chat-suggestion">¿Cuándo contraindico el labetalol en una crisis hipertensiva?</button>
                </div>
            </div>`;
        // Reasignar eventos a las nuevas sugerencias
        document.querySelectorAll('.chat-suggestion').forEach(btn => {
            btn.addEventListener('click', () => {
                chatInput.value = btn.textContent;
                sendMessage();
            });
        });
        chatInput.value = '';
        chatInput.style.height = 'auto';
    }
}

chatBtn.addEventListener('click', toggleChat);
chatClose.addEventListener('click', toggleChat);

// Auto-resize textarea
chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// Enter para enviar (Shift+Enter = salto de línea)
chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

chatSend.addEventListener('click', sendMessage);

// Sugerencias
document.querySelectorAll('.chat-suggestion').forEach(btn => {
    btn.addEventListener('click', () => {
        chatInput.value = btn.textContent;
        sendMessage();
    });
});

function appendMsg(role, text) {
    // Eliminar el estado vacío si existe
    const empty = chatMessages.querySelector('.chat-empty');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    // Convertir **negrita** básica
    div.innerHTML = text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
}

function setTyping(on) {
    isTyping = on;
    chatSend.disabled = on;
    if (on) {
        const d = document.createElement('div');
        d.className = 'chat-msg assistant typing';
        d.id = 'typingIndicator';
        d.textContent = 'Consultando...';
        const empty = chatMessages.querySelector('.chat-empty');
        if (empty) empty.remove();
        chatMessages.appendChild(d);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    } else {
        const t = document.getElementById('typingIndicator');
        if (t) t.remove();
    }
}

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isTyping) return;

    chatInput.value = '';
    chatInput.style.height = 'auto';

    appendMsg('user', text);
    chatHistory.push({ role: 'user', content: text });

    setTyping(true);

    try {
        const res = await fetch('/.netlify/functions/gemini', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: chatHistory })
        });

        const data = await res.json();
        setTyping(false);

        if (!res.ok || data.error) {
            appendMsg('assistant', '⚠ Error: ' + (data.error || res.status));
            return;
        }

        appendMsg('assistant', data.reply);
        chatHistory.push({ role: 'assistant', content: data.reply });

    } catch (err) {
        setTyping(false);
        appendMsg('assistant', '⚠ Sin conexión con el servidor.');
    }
}
}); // DOMContentLoaded
</script>
</body>
</html>
